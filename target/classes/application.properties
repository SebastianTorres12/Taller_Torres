spring.application.name=micro-cursos-uwu
#spring.datasource.url=jdbc:mysql://host.docker.internal:3308/sisdb2025
spring.datasource.url=jdbc:mysql://mysql:3306/sisdb2025

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


#Nivel de log para ver las consultas de SQL
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

server.port=8002
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=always